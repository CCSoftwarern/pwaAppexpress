<!-- Navegação inferior fixa -->

<div class="search-container">
  <mat-form-field appearance="outline" class="search-field" floatLabel="auto">
    <mat-icon matPrefix>search</mat-icon>
    <input matInput placeholder="Pesquisar entregas" [(ngModel)]="filtroEntrega" />
  </mat-form-field>
</div>

<mat-list role="list" class="scrollable-list" >
  @for (entrega of entregas; track entrega) {

    <mat-list-item role="listitem">
      <div class="d-flex justify-content-between">
        <div>
          <h6 class="mb-1">#{{ entrega.id }} - 10/05/2025 23:04:47</h6>
          <p class="mb-1">Endereço: {{ entrega.destinatario}}</p>
        </div>
        <button mat-icon-button (click)="abrirModal()">
          <mat-icon>info</mat-icon>
        </button>
      </div>
    </mat-list-item>
  }
</mat-list>








<nav class="bottom-nav fixed-bottom navbar-light bg-light border-top">
  <a mat-button (click)="goToTab(0)" routerLinkActive="active">
    <mat-icon>home</mat-icon>
    <span>Home</span>
  </a>
  <a mat-button (click)="goToTab(1)" routerLinkActive="active">
    <mat-icon>search</mat-icon>
    <span>Buscar</span>
  </a>
  <a mat-button (click)="goToTab(2)" routerLinkActive="active">
    <mat-icon>person</mat-icon>
    <span>Perfil</span>
  </a>
</nav>
